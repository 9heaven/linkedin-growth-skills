schema_version: "1.1"
name: profile-audit-mixed-positioning
expected_outcome: |
  A full audit of a profile whose banner, headline, and Services sell different
  things and whose feed has been silent for 11 months. The response reports the
  mismatch and bases the rewrites on the clinic positioning. The biggest leak is
  publishing even though the score is not under 40. The engagement rate is N/A,
  the viewer titles are flagged as the wrong audience, and each do-this-week item
  says where the edit lives.
